
{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Portfólio de Igor Ventura. Projetos de engenharia, programação e tecnologia.">

    <title>
        {% block title %}Igor Ventura | Portfólio{% endblock %}
    </title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect"
        href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
        href="{% static 'css/variables.css' %}">
    <link rel="stylesheet"
        href="{% static 'css/base.css' %}">
    <link rel="stylesheet"
        href="{% static 'css/components.css' %}">

    {% block extra_css %}{% endblock %}
</head>

<body>
    {% include "components/header.html" %}

    <main id="main-content">
        {% block content %}{% endblock %}
    </main>

    {% include "components/footer.html" %}

    <script src="{% static 'js/main.js' %}" defer></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
